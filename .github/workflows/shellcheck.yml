name: ShellCheck

on:
  push:
    paths:
      - 'scripts/**'
  pull_request:
    paths:
      - 'scripts/**'
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: ShellCheck
        # zsh nicht nativ unterstützt – bash als nächste Näherung
        run: |
          shellcheck --version
          shellcheck \
            --shell=bash \
            --severity=warning \
            --exclude=SC1090,SC1091,SC2034,SC2206,SC2296,SC2178,SC2128,SC2076 \
            scripts/*.sh
